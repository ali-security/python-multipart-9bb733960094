# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      env:
        PIP_INDEX_URL: "https://:2024-02-10@time-machines-pypi.sealsecurity.io/"
      run: |
        python -m pip install --upgrade pip
        # The released wheel's WHEEL Generator is hatchling 1.21.1; a default
        # isolated build would install whatever hatchling is newest and change
        # that line, so pin it and build against it directly.
        pip install build hatchling==1.21.1

    - name: Build package
      run: python -m build --no-isolation

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
