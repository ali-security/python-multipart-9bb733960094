name: Python package

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector; empty runs the full suite"
        required: false
        default: ""


jobs:
  build:

    # ubuntu-latest is 24.04, whose setup-python manifest has no CPython 3.8;
    # 22.04 provisions the whole 3.8-3.12 matrix.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          # Release-era index: pip/hatch/ruff resolved as of 2024-02-10 so the
          # 3.8 leg is not handed post-EOL tooling.
          PIP_INDEX_URL: "https://:2024-02-10@time-machines-pypi.sealsecurity.io/"
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Lint
        if: matrix.python-version == '3.8'
        run: |
          ruff multipart tests
      - name: Test with pytest
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            pytest --timeout=30 tests -k "${{ inputs.test-filter }}"
          else
            inv test
          fi
